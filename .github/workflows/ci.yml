name: CI

# Runs on every push and pull request targeting main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# If you push again before a run finishes, cancel the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1) Secret scanning — runs first. A leaked credential blocks everything.
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so gitleaks can scan all commits
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2) Backend — dependency audit, build, image scan, health smoke test.
  backend:
    name: Backend (audit, build, scan, smoke)
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependency audit (pip-audit)
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r backend/requirements.txt

      - name: Build API image
        run: docker build -t glasshouse-api:ci ./backend

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: glasshouse-api:ci
          format: table
          exit-code: '1'
          severity: 'CRITICAL'
          ignore-unfixed: true

      - name: Health smoke test
        run: |
          # /health does not touch the DB, so dummy env is fine to boot the app.
          docker run -d --name glasshouse-ci \
            -e ENV=ci \
            -e ALLOWED_ORIGINS=http://localhost \
            -e DATABASE_URL=postgresql+asyncpg://u:p@localhost/db \
            -e PEPPER=ci-dummy-pepper \
            -e JWT_SECRET=ci-dummy-jwt-secret \
            -p 8000:8000 \
            glasshouse-api:ci
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8000/health; then
              echo "health OK"; exit 0
            fi
            echo "waiting for app to boot ($i)..."; sleep 2
          done
          echo "health check FAILED — container logs:"
          docker logs glasshouse-ci
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f glasshouse-ci || true
