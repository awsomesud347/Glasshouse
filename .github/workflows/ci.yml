name: CI

# Runs on every push and pull request targeting main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# If you push again before a run finishes, cancel the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Secret scanning — runs first. A leaked credential blocks everything.
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so gitleaks can scan all commits
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. Backend — dependency audit, image build, image vulnerability scan.
  #    (Live boot is verified by the CD workflow's post-deploy health check
  #    against the real stack, since the app requires a reachable DB at startup.)
  backend:
    name: Backend (audit, build, scan)
    runs-on: ubuntu-latest
    needs: secret-scan


    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependency audit (pip-audit)
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r backend/requirements.txt

      - name: Build API image
        run: docker build -t glasshouse-api:ci ./backend

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: glasshouse-api:ci
          format: table
          exit-code: '1'
          severity: 'CRITICAL'
          ignore-unfixed: true